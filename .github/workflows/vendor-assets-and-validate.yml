name: Validate Spanish build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vendor-assets-and-validate.yml"
      - "src/**"
      - "package.json"
      - "vite.config.ts"
      - "tsconfig.json"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
