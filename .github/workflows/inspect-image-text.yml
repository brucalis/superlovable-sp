name: Inspect image text

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-image-text.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OCR tools
        run: |
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y tesseract-ocr tesseract-ocr-por >/dev/null
          python -m pip install --quiet pillow pytesseract
      - name: Inspect images
        run: |
          python - <<'PY'
          from PIL import Image
          import pytesseract
          from pytesseract import Output
          for path in ['public/creditos-esgotados.webp','public/comparacao-com-extensao.webp']:
              im=Image.open(path).convert('RGB')
              print('\n###', path, 'size=', im.size)
              data=pytesseract.image_to_data(im, lang='por+eng', output_type=Output.DICT, config='--psm 11')
              for i,t in enumerate(data['text']):
                  t=t.strip()
                  if not t: continue
                  c=float(data['conf'][i]) if str(data['conf'][i]).replace('.','',1).lstrip('-').isdigit() else -1
                  if c < 20: continue
                  print(f"{data['left'][i]},{data['top'][i]},{data['width'][i]},{data['height'][i]} conf={c:.0f} :: {t}")
          PY
