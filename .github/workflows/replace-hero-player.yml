name: Replace hero player

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-hero-player.yml'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build hero image asset
        run: |
          cat .github/tmp/hero_*.b64 | base64 -d > public/hero-superlovable.webp
          file public/hero-superlovable.webp
          test "$(stat -c%s public/hero-superlovable.webp)" -gt 50000

      - name: Replace video player with static image
        run: python .github/tmp/patch_hero.py

      - name: Remove temporary files
        run: rm -rf .github/tmp

      - name: Validate build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: substituir vídeo da hero por imagem' || exit 0
          git push
